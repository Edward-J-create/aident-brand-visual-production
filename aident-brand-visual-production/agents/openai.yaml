interface:
  display_name: "Aident Brand Visual Production"
  short_description: "Produce marketing image kits and video production kits from pack handoffs."
  brand_color: "#4C5CFF"
  default_prompt: |
    Use $aident-brand-visual-production to turn a frozen marketing-pack handoff into batch-rendered
    image assets and video production frames, inspect the outputs, and return a pack-aligned
    manifest; never redraw supplied logos or label storyboards as final video.
policy:
  allow_implicit_invocation: true
