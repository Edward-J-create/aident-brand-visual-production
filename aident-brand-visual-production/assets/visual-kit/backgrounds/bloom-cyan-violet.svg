<svg xmlns="http://www.w3.org/2000/svg" width="1889" height="1552" viewBox="0 0 1889 1552" fill="none">
  <!-- Bloom for the stage poster.
       Transparent outside the blurred ellipse. Recolour by swapping this file.
       Baked at full strength. Each poster sets its own layer opacity.
       Padded by 300px on every side so the blur falls off inside the file.
       Place at (x - 300, y - 300) and let the parent clip. -->
  <defs>
    <linearGradient id="g" x1="0.95" y1="0.95" x2="0.05" y2="0.1">
      <stop offset="0" stop-color="#15FFEF"/>
      <stop offset="1" stop-color="#7B4FFF"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1889" height="1552" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
  </defs>
  <ellipse cx="944.5" cy="776" rx="644.5" ry="476"
           fill="url(#g)" filter="url(#soft)"/>
</svg>
