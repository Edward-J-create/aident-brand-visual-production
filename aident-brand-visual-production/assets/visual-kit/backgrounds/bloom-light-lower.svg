<svg xmlns="http://www.w3.org/2000/svg" width="1910" height="1397" viewBox="0 0 1910 1397" fill="none">
  <!-- Lower pastel cluster for the light 1270x760 banner.
       Transparent outside the blurred discs. Recolour by swapping this file.
       Fill opacity is baked in; do not re-dim the layer in CSS.
       Padded by 407px on every side so the blur falls off inside the file.
       Place at (x - 407, y - 407) and let the parent clip. -->
  <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1910" height="1397" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="135.7"/>
  </filter>
  <circle cx="625.345" cy="771.813" r="218.345" fill="#A5D5FF" fill-opacity="0.2" filter="url(#soft)"/>
  <circle cx="962.618" cy="713.829" r="236.132" fill="#6462EA" fill-opacity="0.2" filter="url(#soft)"/>
  <circle cx="1297.47" cy="612.465" r="205.465" fill="#1DFF5D" fill-opacity="0.2" filter="url(#soft)"/>
</svg>
