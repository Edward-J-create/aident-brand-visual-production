<svg xmlns="http://www.w3.org/2000/svg" width="2321" height="1748" viewBox="0 0 2321 1748" fill="none">
  <!-- Top bleed glow for the 2048-wide social banners.
       Transparent outside the blurred discs. Recolour by swapping this file.
       Fill opacity is baked in; do not re-dim the layer in CSS.
       Padded by 553px on every side so the blur falls off inside the file.
       Place at (x - 553, y - 553) and let the parent clip. -->
  <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="2321" height="1748" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="184.37"/>
  </filter>
  <circle cx="1471.33" cy="849.667" r="296.667" fill="#FD9CFF" fill-opacity="0.14" filter="url(#soft)"/>
  <circle cx="832.167" cy="832.167" r="279.167" fill="#1DFF5D" fill-opacity="0.14" filter="url(#soft)"/>
  <circle cx="1135.5" cy="873.833" r="320.833" fill="#1DFFFF" fill-opacity="0.14" filter="url(#soft)"/>
</svg>
