<svg xmlns="http://www.w3.org/2000/svg" width="2644" height="1991" viewBox="0 0 2644 1991" fill="none">
  <!-- Top bleed glow, wide. Dark tile poster and the 1920x1080 cover.
       Transparent outside the blurred discs. Recolour by swapping this file.
       Fill opacity is baked in; do not re-dim the layer in CSS.
       Padded by 630px on every side so the blur falls off inside the file.
       Place at (x - 630, y - 630) and let the parent clip. -->
  <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="2644" height="1991" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="210.02"/>
  </filter>
  <circle cx="1676.07" cy="967.932" r="337.932" fill="#FD9CFF" fill-opacity="0.14" filter="url(#soft)"/>
  <circle cx="947.997" cy="947.997" r="317.997" fill="#1DFF5D" fill-opacity="0.14" filter="url(#soft)"/>
  <circle cx="1293.52" cy="995.46" r="365.46" fill="#1DFFFF" fill-opacity="0.14" filter="url(#soft)"/>
</svg>
