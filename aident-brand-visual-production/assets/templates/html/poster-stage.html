<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-slot="title-tag">Product poster — indigo</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="poster-kit.css">
  <link rel="stylesheet" href="../../fonts/fonts.css">
  <style>
    /* Fixed poster type "indigo" — see ../poster-specs.json */
    .poster { background: linear-gradient(90deg, #E7FFFE 0%, #F2F9FF 50%, #EFE7FF 100%); }
    .poster-panel {
      background: linear-gradient(180deg, #1A0063 0%, #3150BE 100%);
      border-radius: 0 0 80px 80px;
    }
    .poster-tiles {
      left: -87px;
      top: -9px;
      width: 1416px;
      height: 1473px;
      opacity: 0.6;
      background-image: url("../../visual-kit/materials/tile-field.svg");
      background-size: 1416px 1473px;
    }
    .poster-glow {
      left: -241px;
      top: -674px;
      width: 1724px;
      height: 1298px;
      background-image: url("../../visual-kit/backgrounds/top-glow.svg");
      background-size: 1724px 1298px;
    }
    .poster-bloom {
      left: -338px;
      top: 161px;
      width: 1889px;
      height: 1552px;
      opacity: 0.4;
      background-image: url("../../visual-kit/backgrounds/bloom-cyan-violet.svg");
      background-size: 1889px 1552px;
    }
    .poster-title { left: 162px; width: 918px; }
    .poster-middle {
      left: 191px;
      top: 859px;
      width: 860px;
      height: 515px;
      border-radius: 40px;
      background: linear-gradient(90deg, rgba(118,236,222,0.16) 0%, rgba(132,208,255,0.16) 100%);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: none;
      backdrop-filter: blur(18px);
    }
    .poster-headline { background-image: linear-gradient(90deg, #EBFEFC 0%, #EBE3FF 100%); font-weight: 500; }
    .poster-headline-accent { background-image: linear-gradient(90deg, #9AFFF8 0%, #DAF4FF 49%, #CAB7FF 100%); font-weight: 500; }
    .poster-subcopy { color: rgba(255,255,255,0.7); }
    .poster-url { background-image: linear-gradient(90deg, #039987 0%, #0281D0 49%, #4B56F8 100%); }
  </style>
</head>
<body>
  <article class="poster" data-template-id="tpl-poster-stage" data-poster-type="indigo" data-width="1242" data-height="1660">
    <div class="poster-panel">
      <div class="poster-tiles"></div>
      <div class="poster-glow"></div>
      <div class="poster-bloom"></div>
      <div class="poster-middle" data-slot="ui-screenshot">
        <span class="poster-middle-label">Supplied product UI, screenshot, or SVG</span>
      </div>
    </div>
    <img class="poster-grain" src="../../visual-kit/materials/grain-overlay.svg" alt="">
    <div class="poster-title">
      <h1 class="poster-headline" data-slot="headline" contenteditable="true">Headline line one</h1>
      <p class="poster-headline-accent" data-slot="headline-accent" contenteditable="true"></p>
      <p class="poster-subcopy" data-slot="subcopy" contenteditable="true">Supporting line under the headline.</p>
    </div>
    <div class="poster-logo" data-slot="logo"></div>
    <p class="poster-url" data-slot="url" contenteditable="true"></p>
  </article>
</body>
</html>
