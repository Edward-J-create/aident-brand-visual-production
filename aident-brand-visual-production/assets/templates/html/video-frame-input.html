<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="tokens.css">

  <style>
    /* tpl-video-frame-input — one prompt pill. Width and height follow the text. */
    .vf {
      --vf-field: #F0F8F1;
      --vf-ink: #151715;
    }
    .vf-mesh {
      left: -1449px;
      top: -1861px;
      width: 4818px;
      height: 4664px;
      background-image: url("../../visual-kit/backgrounds/mesh-bloom.svg");
      background-size: 4818px 4664px;
    }
    .vf-input {
      left: 50%;
      top: 459px;
      transform: translateX(-50%);
      border-radius: 999px;
      padding: 28px 40px;
    }
    .vf-input p { font-size: 36px; line-height: 48px; white-space: nowrap; }
  </style>
</head>
<body>
  <article class="vf" data-template-id="tpl-video-frame-input" data-width="1920" data-height="1080">
    <div class="vf-mesh"></div>
    <div class="vf-bubble vf-input">
      <p data-slot="headline" contenteditable="true">Type a prompt</p>
    </div>
  </article>
