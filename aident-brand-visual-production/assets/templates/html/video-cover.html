<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-slot="title-tag">Video cover / horizontal poster</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="landscape-kit.css">
  <link rel="stylesheet" href="../../fonts/fonts.css">
  <style>
    /* tpl-video-cover — 1920x1080. Fixed layout, see ../banner-specs.json */
    .ls {
      --ls-field: #111114;
      width: 1920px;
      height: 1080px;
    }
.ls-glow {
      left: -362px;
      top: -971px;
      width: 2644px;
      height: 1991px;
      background-image: url("../../visual-kit/backgrounds/top-glow-wide.svg");
      background-size: 2644px 1991px;
    }
.ls-tiles {
      left: -128px;
      top: -25px;
      width: 2075px;
      height: 1169px;
      background-image: url("../../visual-kit/backgrounds/../materials/tile-field-wide.svg");
      background-size: 2075px 1169px;
      opacity: 0.8;
    }
.ls-tiles-2 {
      left: -75px;
      top: 617px;
      width: 2017px;
      height: 580px;
      background-image: url("../../visual-kit/backgrounds/../materials/tile-field-strip.svg");
      background-size: 2017px 580px;
      opacity: 0.8;
    }
.ls-tiles-2 { position: absolute; pointer-events: none; background-repeat: no-repeat; z-index: 1; }
    .ls-grain {
      left: 0px;
      top: -24px;
      width: 1920px;
      height: 1128px;
      opacity: 0.2;
    }
    .ls-stack {
      left: 488px;
      top: 140px;
      width: 945px;
      gap: 81px;
    }
    .ls-logo { width: 555px; height: 80px; }
    .ls-headline, .ls-accent {
      font-size: 132px;
      line-height: 145.2px;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 10.7px rgba(0,0,0,0.25);
    }
    .ls-headline { background-image: linear-gradient(90deg, #EBFEFC 0%, #EBE3FF 100%); }
    .ls-accent { background-image: linear-gradient(90deg, #9AFFF8 0%, #DAF4FF 49%, #CAB7FF 100%); }
    .ls-subcopy { font-size: 36px; line-height: 50.4px; color: rgba(255,255,255,0.7); }
    .ls-ui {
      left: 416px;
      top: 689px;
      width: 1088px;
      height: 405px;
      border-radius: 13.5px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0) 100%);
    }
  </style>
</head>
<body>
  <article class="ls" data-template-id="tpl-video-cover" data-width="1920" data-height="1080">
    <div class="ls-glow"></div>
    <div class="ls-tiles"></div>
    <div class="ls-tiles-2"></div>
    <div class="ls-ui" data-slot="ui-screenshot">
      <span class="ls-slot-label">Supplied product UI, screenshot, or SVG</span>
    </div>
    <div class="ls-stack">
      <div class="ls-logo" data-slot="logo"></div>
      <div class="ls-title">
        <h1 class="ls-headline" data-slot="headline" contenteditable="true">Headline line one</h1>
        <p class="ls-accent" data-slot="headline-accent" contenteditable="true"></p>
        <p class="ls-subcopy" data-slot="subcopy" contenteditable="true"></p>
      </div>
    </div>
    <img class="ls-grain" src="../../visual-kit/materials/grain-overlay.svg" alt="">
  </article>
</body>
</html>
